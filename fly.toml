# Fly.io — troque "desafio-30-dias" por um nome único (fly launch --no-deploy já faz isso).
app = "desafio-30-dias"
primary_region = "gru" # São Paulo

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/data.db"
  TRUST_PROXY = "1"

# SQLite mora neste volume. Ele só pode ser montado em UMA máquina:
# por isso o app roda com 1 máquina (não escale horizontalmente).
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
